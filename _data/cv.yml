  summary: >
    Cosmochemist studying presolar grains — tiny dust grains older than the Sun
    that survived the formation of the solar system. I use high-precision NanoSIMS
    and other microanalytical techniques to constrain stellar nucleosynthesis,
    the origin of the solar system, and Galactic chemical evolution.
